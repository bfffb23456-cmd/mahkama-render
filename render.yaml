services:
  - type: web
    name: mahkama-game
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/mahkama.db
    disk:
      name: mahkama-data
      mountPath: /var/data
      sizeGB: 1
